<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>哈基米塔防 · 矢量美术小样</title>
<style>
  body { margin: 0; background: #f3ede2; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1640" height="1820"></canvas>
<script>
/* ============================================================
 * 哈基米塔防 · 参数化矢量萌宠生成器（美术验证小样）
 * 平面无描边风格：大圆头 + 大眼高光 + 粉耳腮红
 * ============================================================ */
const ctx = document.getElementById('c').getContext('2d')

/* ---------- 基础形状工具 ---------- */
function rr(c, x, y, w, h, r) {
  c.beginPath()
  c.moveTo(x + r, y)
  c.arcTo(x + w, y, x + w, y + h, r)
  c.arcTo(x + w, y + h, x, y + h, r)
  c.arcTo(x, y + h, x, y, r)
  c.arcTo(x, y, x + w, y, r)
  c.closePath()
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill() }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fill() }
function stroke(c, color, w, fn, cap = 'round') {
  c.strokeStyle = color; c.lineWidth = w; c.lineCap = cap
  c.beginPath(); fn(c); c.stroke()
}
function clipPath(c, fn, draw) {
  c.save(); c.beginPath(); fn(c); c.clip(); draw(); c.restore()
}

/* ---------- 稀有度 ---------- */
const RARITY_COLOR = { N: '#9aa3ad', R: '#4a90e2', SR: '#9b59d0', SSR: '#e6a817' }
const RARITY_SCALE = { N: 0.92, R: 0.96, SR: 1, SSR: 1.08 }

/* ============================================================
 * 宠物绘制（坐标系：头中心 (0,0)，头半径 44）
 * ============================================================ */

function drawShadow(c) {
  c.fillStyle = 'rgba(74,59,50,0.14)'
  ell(c, 0, 92, 44, 10)
}

function drawTail(c, d) {
  const col = d.tailColor || d.body
  if (d.tail === 'cat') {
    stroke(c, col, 11, k => {
      k.moveTo(26, 68); k.bezierCurveTo(70, 72, 90, 46, 76, 16)
    })
    c.fillStyle = d.tailTip || d.belly || '#fff'
    circle(c, 76, 16, 6.5)
  } else if (d.tail === 'curl') {
    stroke(c, d.belly, 13, k => {
      k.moveTo(30, 60); k.quadraticCurveTo(48, 30, 62, 50); k.quadraticCurveTo(66, 62, 52, 58)
    })
  } else if (d.tail === 'straight') {
    c.fillStyle = col
    c.beginPath()
    c.moveTo(28, 66); c.quadraticCurveTo(60, 58, 68, 34)
    c.quadraticCurveTo(70, 26, 62, 28)
    c.quadraticCurveTo(52, 46, 26, 54)
    c.closePath(); c.fill()
    c.fillStyle = d.tailTip || d.belly
    circle(c, 65, 32, 5.5)
  } else if (d.tail === 'stub') {
    c.fillStyle = col
    ell(c, 34, 60, 11, 8, 0.5)
  }
}

function drawBody(c, d) {
  const bodyW = d.bodyW || 1
  c.fillStyle = d.body
  ell(c, 0, 58, 40 * bodyW, 34)
  if (d.belly) {
    c.fillStyle = d.belly
    ell(c, 0, 66, 25 * bodyW, 21)
  }
  // 体侧花块（奶牛/三花）
  if (d.bodyPatches) {
    clipPath(c, k => ell(k, 0, 58, 40 * bodyW, 34), () => {
      c.fillStyle = d.patternColor
      for (const [px, py, pr] of d.bodyPatches) circle(c, px, py, pr)
      if (d.bodyPatches2) {
        c.fillStyle = d.patternColor2
        for (const [px, py, pr] of d.bodyPatches2) circle(c, px, py, pr)
      }
    })
  }
  // 前爪
  c.fillStyle = d.pawColor || d.body
  ell(c, -16 * bodyW, 86, 12, 8)
  ell(c, 16 * bodyW, 86, 12, 8)
}

function drawHead(c, d) {
  // 蓬毛（比熊/萨摩）
  if (d.fluff) {
    c.fillStyle = d.body
    for (const a of [-150, -115, -90, -65, -30]) {
      const rad = a * Math.PI / 180
      circle(c, Math.cos(rad) * 38, Math.sin(rad) * 38 - 4, 13)
    }
  }
  c.fillStyle = d.body
  circle(c, 0, 0, 44)
}

function drawPattern(c, d) {
  if (!d.pattern) return
  clipPath(c, k => circle(k, 0, 0, 44), () => {
    if (d.pattern === 'stripes') {
      c.fillStyle = d.patternColor
      for (const sx of [-18, 0, 18]) {
        c.beginPath()
        c.moveTo(sx - 8, -46)
        c.quadraticCurveTo(sx - 1, -26, sx - 3, -12)
        c.lineTo(sx + 5, -12)
        c.quadraticCurveTo(sx + 7, -28, sx + 8, -46)
        c.closePath(); c.fill()
      }
    } else if (d.pattern === 'patch') {
      c.fillStyle = d.patternColor
      for (const [px, py, pr] of d.patchSpots) circle(c, px, py, pr)
      if (d.patchSpots2) {
        c.fillStyle = d.patternColor2
        for (const [px, py, pr] of d.patchSpots2) circle(c, px, py, pr)
      }
    } else if (d.pattern === 'blaze') {
      c.fillStyle = d.patternColor
      c.beginPath()
      c.moveTo(-10, -46); c.quadraticCurveTo(-4, -14, -7, 22)
      c.lineTo(7, 22); c.quadraticCurveTo(4, -14, 10, -46)
      c.closePath(); c.fill()
    } else if (d.pattern === 'cap') {
      c.fillStyle = d.patternColor
      c.beginPath(); c.arc(0, -2, 43, Math.PI, Math.PI * 2); c.closePath(); c.fill()
      circle(c, 0, -2, 43)
    } else if (d.pattern === 'mask') {
      c.fillStyle = d.patternColor
      ell(c, 0, 3, 27, 23)
    } else if (d.pattern === 'spots') {
      c.fillStyle = d.patternColor
      for (const [px, py, pr] of d.patchSpots) circle(c, px, py, pr)
    }
  })
}

function drawMuzzle(c, d) {
  if (d.muzzle) {
    c.fillStyle = d.muzzle
    ell(c, 0, 10, 17, 13)
  }
}

function drawEyes(c, d) {
  const eyeColor = d.eyeColor || '#2b2b33'
  if (d.eyes === 'happy') {
    stroke(c, eyeColor, 3.2, k => {
      k.arc(-17, 0, 7, Math.PI * 1.08, Math.PI * 1.92)
      k.moveTo(24, 0); k.arc(17, 0, 7, Math.PI * 1.08, Math.PI * 1.92)
    })
    return
  }
  for (const sx of [-17, 17]) {
    c.fillStyle = eyeColor
    ell(c, sx, -2, 6.5, 9)
    c.fillStyle = 'rgba(255,255,255,0.95)'
    circle(c, sx + 2.2, -5, 2.8)
    c.fillStyle = 'rgba(255,255,255,0.75)'
    circle(c, sx - 1.6, 1, 1.4)
    if (d.eyes === 'sparkle') {
      c.fillStyle = '#fff'
      c.beginPath()
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 2
        const r1 = i % 2 ? 1.6 : 3.4
        c.lineTo(sx + Math.cos(a) * r1, -3 + Math.sin(a) * r1)
      }
      c.closePath(); c.fill()
    }
  }
}

function drawNoseMouth(c, d) {
  const line = '#7a5a4a'
  if (d.nose === 'dog') {
    c.fillStyle = '#4a3f3a'
    ell(c, 0, 8, 5.5, 4)
    if (d.mouth === 'open') {
      c.fillStyle = '#5a4440'
      c.beginPath()
      c.moveTo(-8, 13); c.quadraticCurveTo(0, 26, 8, 13)
      c.quadraticCurveTo(0, 17, -8, 13); c.closePath(); c.fill()
      c.fillStyle = '#ff9db4'
      ell(c, 0, 20, 4.5, 3.5)
    } else {
      stroke(c, line, 2.2, k => { k.arc(0, 12, 7, Math.PI * 0.15, Math.PI * 0.85) })
    }
  } else {
    c.fillStyle = '#ff9db4'
    c.beginPath()
    c.moveTo(-3.5, 7); c.lineTo(3.5, 7); c.quadraticCurveTo(0, 12.5, -3.5, 7)
    c.closePath(); c.fill()
    stroke(c, line, 2, k => {
      k.arc(-4.5, 13, 4.2, Math.PI * 1.05, Math.PI * 1.95)
      k.moveTo(0.3, 13); k.arc(4.5, 13, 4.2, Math.PI * 1.05, Math.PI * 1.95)
    })
  }
}

function drawFace(c, d) {
  drawEyes(c, d)
  drawNoseMouth(c, d)
  if (d.blush !== false) {
    c.fillStyle = 'rgba(255,140,150,0.4)'
    ell(c, -27, 9, 7, 4.5)
    ell(c, 27, 9, 7, 4.5)
  }
  if (d.species === 'cat') {
    c.strokeStyle = 'rgba(60,45,40,0.3)'; c.lineWidth = 1.4; c.lineCap = 'round'
    for (const side of [-1, 1]) {
      c.beginPath(); c.moveTo(side * 21, 7); c.lineTo(side * 39, 3); c.stroke()
      c.beginPath(); c.moveTo(side * 21, 12); c.lineTo(side * 39, 14); c.stroke()
    }
  }
}

function drawEars(c, d) {
  const base = d.earColor || d.body
  const inner = '#ffb3c0'
  if (d.ears === 'floppy') return // 垂耳在头后绘制
  for (const side of [-1, 1]) {
    if (d.ears === 'catPointy') {
      // 更高更立体的猫耳
      c.fillStyle = base
      c.beginPath()
      c.moveTo(side * 34, -26)
      c.quadraticCurveTo(side * 46, -72, side * 16, -60)
      c.quadraticCurveTo(side * 22, -40, side * 24, -20)
      c.closePath(); c.fill()
      if (d.innerEar !== false) {
        c.fillStyle = inner
        c.beginPath()
        c.moveTo(side * 31, -30)
        c.quadraticCurveTo(side * 38, -58, side * 22, -51)
        c.quadraticCurveTo(side * 26, -39, side * 28, -28)
        c.closePath(); c.fill()
      }
      if (d.tufts) {
        c.fillStyle = d.patternColor || base
        c.beginPath()
        c.moveTo(side * 38, -56); c.lineTo(side * 52, -76); c.lineTo(side * 46, -52)
        c.closePath(); c.fill()
      }
    } else if (d.ears === 'catFold') {
      c.fillStyle = base
      ell(c, side * 36, -34, 16, 12, side * 0.5)
      c.fillStyle = inner
      ell(c, side * 36, -34, 8, 5.5, side * 0.5)
    } else if (d.ears === 'dogPointy') {
      c.fillStyle = base
      c.beginPath()
      c.moveTo(side * 42, -16)
      c.quadraticCurveTo(side * 58, -54, side * 26, -58)
      c.quadraticCurveTo(side * 12, -42, side * 18, -12)
      c.closePath(); c.fill()
      c.fillStyle = inner
      c.beginPath()
      c.moveTo(side * 36, -20)
      c.quadraticCurveTo(side * 45, -46, side * 27, -48)
      c.quadraticCurveTo(side * 19, -37, side * 23, -18)
      c.closePath(); c.fill()
    }
  }
}

function drawFloppyEars(c, d) {
  const base = d.earColor || d.body
  // 从头顶两侧垂到脸颊旁（更明确的垂耳剪影）
  for (const side of [-1, 1]) {
    c.fillStyle = base
    c.beginPath()
    c.ellipse(side * 41, -2, 14, 26, side * 0.18, 0, Math.PI * 2)
    c.fill()
    c.fillStyle = 'rgba(0,0,0,0.06)'
    c.beginPath()
    c.ellipse(side * 44, 4, 8, 16, side * 0.18, 0, Math.PI * 2)
    c.fill()
  }
}

function drawAccessories(c, d) {
  if (!d.acc) return
  if (d.acc.includes('collar')) {
    stroke(c, '#e04b4b', 9, k => { k.arc(0, 34, 31, Math.PI * 0.22, Math.PI * 0.78) }, 'butt')
  }
  if (d.acc.includes('bell')) {
    c.fillStyle = '#f5c542'
    circle(c, 0, 66, 7)
    c.fillStyle = '#b8860b'
    c.fillRect(-1, 66, 2, 5)
    circle(c, 0, 62, 1.6)
  }
  if (d.acc.includes('coin')) {
    // 招财：举起的左爪 + 金币
    c.fillStyle = d.body
    ell(c, -40, 10, 12, 20, 0.55)
    c.fillStyle = '#f5c542'
    circle(c, -46, -16, 11)
    c.strokeStyle = '#c9971a'; c.lineWidth = 2
    c.beginPath(); c.arc(-46, -16, 11, 0, Math.PI * 2); c.stroke()
    c.fillStyle = '#8a6508'
    c.font = 'bold 13px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'
    c.fillText('福', -46, -15)
  }
  if (d.acc.includes('halo')) {
    stroke(c, '#ffd75e', 5, k => { k.ellipse(0, -58, 21, 6.5, 0, 0, Math.PI * 2) })
    c.fillStyle = '#ffd75e'
    for (const [sx, sy] of [[-54, -36], [52, -28]]) {
      c.beginPath()
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 2
        const r1 = i % 2 ? 2.2 : 6
        c.lineTo(sx + Math.cos(a) * r1, sy + Math.sin(a) * r1)
      }
      c.closePath(); c.fill()
    }
  }
  if (d.acc.includes('scarf')) {
    c.fillStyle = '#e04b4b'
    c.beginPath()
    c.moveTo(-17, 42); c.lineTo(17, 42); c.lineTo(0, 64); c.closePath(); c.fill()
    c.fillStyle = '#c23e3e'
    ell(c, 0, 43, 18, 5)
  }
  if (d.acc.includes('tag')) {
    c.fillStyle = '#f5c542'
    circle(c, 0, 68, 6)
    c.strokeStyle = '#c9971a'; c.lineWidth = 1.6
    c.beginPath(); c.arc(0, 68, 6, 0, Math.PI * 2); c.stroke()
  }
}

function drawPet(c, d, scale = 1) {
  c.save()
  c.scale(scale, scale)
  drawShadow(c)
  drawTail(c, d)
  if (d.ears === 'floppy') drawFloppyEars(c, d)
  drawBody(c, d)
  drawHead(c, d)
  drawPattern(c, d)
  drawMuzzle(c, d)
  drawFace(c, d)
  drawEars(c, d)
  drawAccessories(c, d)
  c.restore()
}

/* ============================================================
 * 敌人绘制（朝左行进）
 * ============================================================ */
function drawMouseBody(c, tint, scale = 1) {
  c.save(); c.scale(scale, scale)
  c.fillStyle = 'rgba(74,59,50,0.14)'
  ell(c, 0, 34, 28, 7)
  // 尾巴
  stroke(c, '#d9a0a6', 3.5, k => {
    k.moveTo(24, 12); k.quadraticCurveTo(44, 6, 50, -12)
  })
  // 耳朵
  c.fillStyle = tint
  circle(c, -6, -26, 12)
  circle(c, 12, -26, 12)
  c.fillStyle = '#ffb3c0'
  circle(c, -6, -26, 6.5)
  circle(c, 12, -26, 6.5)
  // 身体
  c.fillStyle = tint
  ell(c, 0, 4, 24, 21)
  c.fillStyle = 'rgba(255,255,255,0.55)'
  ell(c, -4, 10, 13, 11)
  // 尖嘴（朝左）
  c.beginPath()
  c.moveTo(-20, -2); c.lineTo(-34, 4); c.lineTo(-20, 9)
  c.closePath(); c.fill()
  c.fillStyle = '#ff9db4'
  circle(c, -33, 3, 3)
  // 眼睛
  c.fillStyle = '#2b2b33'
  circle(c, -16, -4, 2.8)
  // 胡须
  stroke(c, 'rgba(60,45,40,0.35)', 1.2, k => {
    k.moveTo(-28, 5); k.lineTo(-40, 2)
    k.moveTo(-28, 8); k.lineTo(-40, 10)
  })
  c.restore()
}

function drawEnemies(c) {
  // 鼠小兵
  drawMouseBody(c, '#9aa0ad')
  // 疾风鼠
  c.save(); c.translate(240, 0)

  // 盾甲鼠

  // 钢盔

  c.beginPath(); c.arc(2, -18, 16, Math.PI, Math.PI * 2); c.closePath(); c.fill()

  c.strokeStyle = '#7d8894'; c.lineWidth = 2.5
  c.beginPath()

  c.fillStyle = '#f0a24a'
  c.beginPath()
  c.moveTo(-30, -16); c.lineTo(-44, -10); c.lineTo(-30, -6)
  c.closePath(); c.fill()
  c.fillStyle = '#fff'

  // 鼠王

    k.moveTo(-22, -9); k.lineTo(-12, -5)

  c.restore()
}

/* ============================================================
 * 弹道图标（矢量）
 * ============================================================ */
function drawProjectiles(c) {
  const draw = { }
  draw.paw = (k) => {
    k.fillStyle = '#e8940f'
    for (const [tx, ty, tr] of [[-9, -8, 5], [0, -11, 5], [9, -8, 5], [-14, 2, 4.4], [14, 2, 4.4]]) circle(k, tx, ty, tr)
    ell(k, 0, 8, 10, 8)
  }
  draw.bone = (k) => {
    k.fillStyle = '#f2ead9'
    k.rotate(-0.5)
    rr(k, -14, -4, 28, 8, 4); k.fill()
    circle(k, -14, -4, 5.5); circle(k, -14, 4, 5.5)
    circle(k, 14, -4, 5.5); circle(k, 14, 4, 5.5)
  }
  draw.fish = (k) => {
    k.fillStyle = '#7fb2e5'
    ell(k, 0, 0, 14, 8)
    k.beginPath(); k.moveTo(12, 0); k.lineTo(22, -8); k.lineTo(22, 8); k.closePath(); k.fill()
    k.fillStyle = '#2b2b33'; circle(k, -8, -2, 1.8)
  }
  draw.yarn = (k) => {
    k.fillStyle = '#e07b7b'; circle(k, 0, 0, 11)
    k.strokeStyle = '#c95f5f'; k.lineWidth = 2
    k.beginPath(); k.arc(0, 0, 11, 0.5, 2.6); k.stroke()
    k.beginPath(); k.arc(-3, -2, 8, 3.2, 5.6); k.stroke()
    stroke(k, '#c95f5f', 2, kk => { kk.moveTo(8, 7); kk.quadraticCurveTo(18, 10, 22, 4) })
  }
  draw.frisbee = (k) => {
    k.fillStyle = '#e07b2a'; ell(k, 0, 0, 14, 6)
    k.fillStyle = '#f59e42'; ell(k, 0, -2, 10, 3.5)
  }
  draw.snow = (k) => {
    k.fillStyle = '#d6ecff'; circle(k, 0, 0, 11)
    k.fillStyle = '#b5dcff'; circle(k, -3, -3, 6)
  }
  draw.star = (k) => {
    k.fillStyle = '#ffd75e'
    k.beginPath()
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5
      const r = i % 2 === 0 ? 13 : 5.5
      k.lineTo(Math.cos(a) * r, Math.sin(a) * r)
    }
    k.closePath(); k.fill()
  }
  const list = [['🐾', draw.paw], ['🦴', draw.bone], ['🐟', draw.fish], ['🧶', draw.yarn], ['🥏', draw.frisbee], ['❄️', draw.snow], ['🌟', draw.star]]
  list.forEach(([, fn], i) => {
    c.save()
    c.translate(150 + i * 190, 0)
    c.fillStyle = '#fff'
    rr(c, -55, -40, 110, 80, 16); c.fill()
    c.strokeStyle = '#e5d8c2'; c.lineWidth = 2
    rr(c, -55, -40, 110, 80, 16); c.stroke()
    fn(c)
    c.restore()
  })
}

/* ============================================================
 * 版面
 * ============================================================ */
function petCard(x, y, d, idx) {
  const w = 300, h = 240
  ctx.save()
  ctx.translate(x, y)
  ctx.fillStyle = '#fffdf8'
  rr(ctx, 0, 0, w, h, 18); ctx.fill()
  ctx.strokeStyle = RARITY_COLOR[d.rarity]; ctx.lineWidth = 3
  rr(ctx, 1.5, 1.5, w - 3, h - 3, 18); ctx.stroke()
  // 柔和底衬圆（让白色宠物也能被看清）
  ctx.fillStyle = '#f3ecdf'
  circle(ctx, w / 2, h / 2 - 6, 66)
  // 宠物主体
  ctx.save()
  ctx.translate(w / 2, h / 2 - 6)
  const s = 0.66 * RARITY_SCALE[d.rarity] * (d.big ? 1.28 : 1)
  drawPet(ctx, d, s)
  ctx.restore()
  // 名称与稀有度
  ctx.fillStyle = '#4a3b32'
  ctx.font = '600 16px "PingFang SC", sans-serif'
  ctx.textAlign = 'center'
  ctx.fillText(d.name, w / 2, h - 26)
  ctx.fillStyle = RARITY_COLOR[d.rarity]
  ctx.font = '800 12px sans-serif'
  ctx.fillText(d.rarity, w - 26, 24)
  ctx.fillStyle = '#c9bda9'
  ctx.fillText(String(idx + 1).padStart(2, '0'), 24, 24)
  ctx.restore()
}

function enemyCard(x, y, name, drawFn) {
  const w = 300, h = 200
  ctx.save()
  ctx.translate(x, y)
  ctx.fillStyle = '#efe9dd'
  rr(ctx, 0, 0, w, h, 18); ctx.fill()
  ctx.strokeStyle = '#d8ccb6'; ctx.lineWidth = 3
  rr(ctx, 1.5, 1.5, w - 3, h - 3, 18); ctx.stroke()
  ctx.save()
  ctx.translate(w / 2, h / 2 + 10)
  drawFn(ctx)
  ctx.restore()
  ctx.fillStyle = '#4a3b32'
  ctx.font = '600 16px "PingFang SC", sans-serif'
  ctx.textAlign = 'center'
  ctx.fillText(name, w / 2, h - 24)
  ctx.restore()
}
